<title>Borsa</title>
<script>
// tema prima del primo paint, per evitare il lampo chiaro
try { const t = JSON.parse(localStorage.getItem("borsa.theme")); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch(e){}
</script>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#111418; --muted:#6b7280; --line:#e5e7eb; --grid:#eef0f3;
  --up:#16a34a; --down:#dc2626; --accent:#2563eb; --chip:#eef0f3; --shadow:0 1px 2px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0b0d10; --card:#15181d; --text:#f2f4f7; --muted:#8b93a1; --line:#232830; --grid:#1d2128;
    --up:#30d158; --down:#ff453a; --accent:#4c8dff; --chip:#1f242b; --shadow:none; color-scheme:dark; }
}
:root[data-theme="dark"]{ --bg:#0b0d10; --card:#15181d; --text:#f2f4f7; --muted:#8b93a1; --line:#232830; --grid:#1d2128;
  --up:#30d158; --down:#ff453a; --accent:#4c8dff; --chip:#1f242b; --shadow:none; color-scheme:dark; }
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{padding:16px clamp(16px,2.5vw,48px) 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 12px}
h1{font-size:28px;margin:0;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:12px}
.hbtns{display:flex;gap:8px}
.iconbtn{border:0;background:var(--chip);color:var(--text);width:38px;height:38px;border-radius:50%;
  font-size:20px;line-height:38px;cursor:pointer;padding:0}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--chip);border-radius:10px;padding:3px}
.seg button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  padding:6px 11px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:var(--shadow)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:16px}
@media (max-width:600px){ .list{grid-template-columns:1fr;gap:10px} }
.card{background:var(--card);border-radius:14px;padding:14px 14px 6px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chead > div:first-child{min-width:0}
.nm{font-weight:650;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sym{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right;white-space:nowrap}
.px{font-weight:650;font-size:20px;font-variant-numeric:tabular-nums}
.ctip{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;min-height:16px;margin:6px 0 2px}
svg.chart{display:block;width:100%;height:clamp(170px,26vh,380px);touch-action:pan-y}
svg.chart .ax{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;margin-top:3px;font-size:12.5px;font-weight:650;padding:2px 7px;border-radius:6px;
  color:#fff;font-variant-numeric:tabular-nums}
.up{background:var(--up)} .down{background:var(--down)} .flat{background:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 10px}
.err{color:var(--down);font-size:12px}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
.panel{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:14px 16px calc(20px + env(safe-area-inset-bottom))}
.panel.wide{max-width:1400px}
@media (min-width:900px){
  .sheet{align-items:center}
  .panel{border-radius:18px;width:92vw;padding:20px 24px 24px}
  .grab{display:none}
}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dname{font-size:22px;font-weight:700;margin:0}
.dmeta{color:var(--muted);font-size:12px}
.dprice{font-size:34px;font-weight:700;margin:10px 0 0;font-variant-numeric:tabular-nums}
.dchg{font-weight:650;font-variant-numeric:tabular-nums}
.chartbox{background:var(--card);border-radius:14px;margin:12px 0;padding:8px 12px 6px;box-shadow:var(--shadow)}
.chartbox .ctip{margin:2px 0 4px}
#bigChart{height:clamp(260px,52vh,640px);touch-action:none}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.stat{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow)}
.stat .k{color:var(--muted);font-size:12px} .stat .v{font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.danger{border:0;background:transparent;color:var(--down);font:inherit;font-weight:600;padding:10px 0;cursor:pointer}
.search{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--card);color:var(--text);outline:none}
.res{display:flex;justify-content:space-between;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.res .a{font-weight:650} .res .b{color:var(--muted);font-size:12px;text-align:right}
.hint{color:var(--muted);font-size:12px;margin-top:10px}
/* invito all'installazione (solo mobile) */
.install{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:20;display:none;
  align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;
  box-shadow:0 6px 24px rgba(0,0,0,.18)}
.install.open{display:flex}
.install img{width:40px;height:40px;border-radius:10px;flex:none}
.install .t{flex:1;min-width:0;font-size:13px} .install .t b{display:block;font-size:14px}
.install button{border:0;font:inherit;font-weight:650;font-size:13px;border-radius:9px;padding:8px 12px;cursor:pointer}
.install .go{background:var(--accent);color:#fff} .install .no{background:transparent;color:var(--muted);padding:8px 4px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Borsa</h1>
      <div class="sub" id="updated">—</div>
    </div>
    <div class="hbtns">
      <button class="iconbtn" id="themeBtn"></button>
      <button class="iconbtn" id="addBtn" aria-label="Aggiungi titolo">+</button>
    </div>
  </header>

  <div class="controls">
    <div class="seg" id="rangeSeg">
      <button data-v="1d">1G</button><button data-v="1w">1S</button><button data-v="1m">1M</button><button data-v="1y">1A</button>
    </div>
    <div class="seg" id="curSeg">
      <button data-v="orig">Orig.</button><button data-v="EUR">€</button><button data-v="USD">$</button>
    </div>
  </div>

  <div class="list" id="list"></div>
</div>

<!-- dettaglio -->
<div class="sheet" id="detail">
  <div class="panel wide">
    <div class="grab"></div>
    <div class="dhead">
      <div>
        <p class="dname" id="dName"></p>
        <div class="dmeta" id="dMeta"></div>
      </div>
      <button class="iconbtn" data-close aria-label="Chiudi">×</button>
    </div>
    <div class="dprice" id="dPrice"></div>
    <div class="dchg" id="dChg"></div>
    <div class="seg" id="dRangeSeg" style="margin-top:12px">
      <button data-v="1d">1G</button><button data-v="1w">1S</button><button data-v="1m">1M</button><button data-v="1y">1A</button>
    </div>
    <div class="chartbox">
      <div class="ctip" id="tip"></div>
      <svg class="chart" id="bigChart"></svg>
    </div>
    <div class="stats" id="stats"></div>
    <button class="danger" id="removeBtn">Rimuovi dalla lista</button>
  </div>
</div>

<!-- aggiunta -->
<div class="sheet" id="adder">
  <div class="panel">
    <div class="grab"></div>
    <div class="dhead" style="margin-bottom:10px">
      <p class="dname">Aggiungi titolo</p>
      <button class="iconbtn" data-close aria-label="Chiudi">×</button>
    </div>
    <input class="search" id="q" placeholder="Nome o ticker (es. Nvidia, ENEL.MI, ^IXIC)" autocomplete="off" autocapitalize="off">
    <div id="results"></div>
    <div class="hint">Puoi anche scrivere direttamente un ticker Yahoo Finance e premere Invio.</div>
  </div>
</div>

<div class="install" id="install" role="dialog" aria-label="Installa l'app">
  <img src="/icon-192.png" alt="">
  <div class="t"><b>Installa Borsa</b><span id="installMsg"></span></div>
  <button class="go" id="installGo">Installa</button>
  <button class="no" id="installNo">Non ora</button>
</div>

<script>
const DEFAULT_LIST = [
  { symbol: "CAN", label: "Canaan" },
  { symbol: "GOOGL", label: "Google" },
  { symbol: "^GSPC", label: "S&P 500" },
  { symbol: "SWDA.MI", label: "MSCI World" }
];

function load(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let watch = load("borsa.watch", DEFAULT_LIST);
let range = load("borsa.range", "1d");
let cur = load("borsa.cur", "EUR");
let theme = load("borsa.theme", "auto");
let detailSym = null, detailRange = "1d";
const cache = {};   // key symbol|range -> data
const fx = {};      // "USDEUR" -> rate

const $ = (id) => document.getElementById(id);

// ---------- tema ----------
const THEMES = { auto: ["◐", "Tema: automatico"], dark: ["☾", "Tema: scuro"], light: ["☀", "Tema: chiaro"] };
function applyTheme(){
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  $("themeBtn").textContent = THEMES[theme][0];
  $("themeBtn").title = $("themeBtn").ariaLabel = THEMES[theme][1];
}
$("themeBtn").onclick = () => {
  theme = { auto: "dark", dark: "light", light: "auto" }[theme] || "auto";
  save("borsa.theme", theme); applyTheme();
};
applyTheme();

async function getChart(symbol, r){
  const key = symbol + "|" + r;
  const c = cache[key];
  if (c && Date.now() - c.t < 60000) return c.d;
  const res = await fetch("/api/chart?symbol=" + encodeURIComponent(symbol) + "&range=" + r);
  const d = await res.json();
  if (!res.ok) throw new Error(d.error || "errore");
  cache[key] = { t: Date.now(), d };
  return d;
}

function normCur(d){
  // Borsa di Londra quota in pence
  if (d.currency === "GBp" || d.currency === "GBX") return { cur: "GBP", k: 0.01 };
  if (d.currency === "ZAc") return { cur: "ZAR", k: 0.01 };
  if (d.currency === "ILA") return { cur: "ILS", k: 0.01 };
  return { cur: d.currency, k: 1 };
}

function isIndex(d){ return d.symbol.startsWith("^") || d.instrumentType === "INDEX"; }

async function getRate(from, to){
  if (!from || from === to) return 1;
  const k = from + to;
  if (fx[k] && Date.now() - fx[k].t < 300000) return fx[k].v;
  const d = await getChart(from + to + "=X", "1d");
  fx[k] = { t: Date.now(), v: d.price };
  return d.price;
}

// restituisce {factor, cur} per convertire i valori nella valuta scelta
async function conv(d){
  if (isIndex(d)) return { f: 1, cur: null };
  const n = normCur(d);
  if (cur === "orig") return { f: n.k, cur: n.cur };
  const rate = await getRate(n.cur, cur);
  return { f: n.k * rate, cur: cur };
}

function fmt(v, c){
  if (v == null || isNaN(v)) return "—";
  const dec = Math.abs(v) < 10 ? 3 : 2;
  if (!c) return v.toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  try { return v.toLocaleString("it-IT", { style: "currency", currency: c, minimumFractionDigits: dec, maximumFractionDigits: dec }); }
  catch(e){ return v.toFixed(dec) + " " + c; }
}

function baseOf(d, r){ return r === "1d" ? d.prevClose : (d.points.length ? d.points[0][1] : null); }

function change(d, r){
  const base = baseOf(d, r);
  if (!base) return null;
  return (d.price - base) / base * 100;
}

function pillHtml(p){
  if (p == null) return '<span class="pill flat">—</span>';
  const cls = p > 0.004 ? "up" : p < -0.004 ? "down" : "flat";
  return `<span class="pill ${cls}">${p >= 0 ? "+" : ""}${p.toFixed(2)}%</span>`;
}

function colorFor(p){ return p == null ? "var(--muted)" : p >= 0 ? "var(--up)" : "var(--down)"; }

// ---------- grafico con assi ----------
function niceStep(span, n){
  const raw = span / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const k = raw / mag;
  return (k <= 1 ? 1 : k <= 2 ? 2 : k <= 5 ? 5 : 10) * mag;
}

// etichetta asse X: chiave di raggruppamento (un tick quando cambia) e testo
function xKey(t, r){
  const d = new Date(t);
  if (r === "1d") return d.getHours();
  if (r === "1y") return d.getFullYear() * 12 + d.getMonth();
  return d.toDateString();
}
function xLabel(t, r){
  const d = new Date(t);
  if (r === "1d") return d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
  if (r === "1w") return d.toLocaleDateString("it-IT", { weekday: "short", day: "numeric" });
  if (r === "1y") return d.toLocaleDateString("it-IT", { month: "short" }) + (d.getMonth() === 0 ? " " + d.getFullYear() : "");
  return d.toLocaleDateString("it-IT", { day: "numeric", month: "short" });
}
function fmtFull(t, r){
  const d = new Date(t);
  const day = d.toLocaleDateString("it-IT", { weekday: "short", day: "numeric", month: "short", year: r === "1y" ? "numeric" : undefined });
  return r === "1d" || r === "1w" ? day + ", " + d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" }) : day;
}

let gradId = 0;
// svg._data = { d, c, p, r }; ridisegna alla dimensione reale dell'elemento (testo nitido)
function drawChart(svg){
  const s = svg._data; if (!s) return;
  const { d, c, p, r } = s;
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const padL = 4, padR = 64, padT = 8, padB = 22;
  const pts = d.points.map((x) => [x[0], x[1] * c.f]);
  const n = pts.length;
  if (n < 2){ svg.innerHTML = `<text class="ax" x="${W / 2}" y="${H / 2}" text-anchor="middle">Dati non disponibili</text>`; svg._st = null; return; }

  let min = Infinity, max = -Infinity;
  for (const q of pts){ if (q[1] < min) min = q[1]; if (q[1] > max) max = q[1]; }
  const baseLine = r === "1d" && d.prevClose ? d.prevClose * c.f : null;
  if (baseLine != null){ min = Math.min(min, baseLine); max = Math.max(max, baseLine); }
  const padV = (max - min) * 0.06 || Math.abs(max) * 0.01 || 1; min -= padV; max += padV;

  const iw = W - padL - padR, ih = H - padT - padB;
  // asse X per indice: niente buchi per notti e weekend
  const X = (i) => padL + i / (n - 1) * iw;
  const Y = (v) => padT + (1 - (v - min) / (max - min)) * ih;

  const step = niceStep(max - min, Math.max(2, Math.floor(ih / 42)));
  const dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
  let grid = "";
  for (let v = Math.ceil(min / step) * step; v <= max; v += step){
    const y = Y(v).toFixed(1);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text class="ax" x="${W - padR + 8}" y="${+y + 4}">${v.toLocaleString("it-IT", { minimumFractionDigits: dec, maximumFractionDigits: dec })}</text>`;
  }

  let ticks = [];
  for (let i = 1; i < n; i++) if (xKey(pts[i][0], r) !== xKey(pts[i - 1][0], r)) ticks.push(i);
  if (r === "1d" || r === "1m") ticks.unshift(0);
  const maxT = Math.max(2, Math.floor(iw / 80));
  if (ticks.length > maxT){ const k = Math.ceil(ticks.length / maxT); ticks = ticks.filter((_, j) => j % k === 0); }
  for (const i of ticks){
    const x = X(i);
    if (x > W - padR - 20) continue;
    grid += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${padT}" y2="${H - padB}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text class="ax" x="${Math.max(x, padL + 14).toFixed(1)}" y="${H - 6}" text-anchor="middle">${xLabel(pts[i][0], r)}</text>`;
  }

  const col = colorFor(p), gid = "g" + (++gradId);
  const line = pts.map((q, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(q[1]).toFixed(1)).join("");
  const area = line + `L${X(n - 1).toFixed(1)},${H - padB}L${X(0).toFixed(1)},${H - padB}Z`;
  svg.innerHTML = `
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    ${baseLine != null ? `<line x1="${padL}" x2="${W - padR}" y1="${Y(baseLine)}" y2="${Y(baseLine)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>` : ""}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <line class="cx" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <circle class="cd" r="4" fill="${col}" visibility="hidden"/>`;
  svg._st = { pts, X, Y, n, padL, iw };
  setIdleTip(svg);
}

function setIdleTip(svg){
  const s = svg._data, st = svg._st;
  if (!svg._tip || !s || !st) return;
  const vals = st.pts.map((q) => q[1]);
  svg._tip.textContent = "Max " + fmt(Math.max(...vals), s.c.cur) + " · Min " + fmt(Math.min(...vals), s.c.cur);
}

function scrub(ev){
  const svg = ev.currentTarget, st = svg._st, s = svg._data;
  if (!st) return;
  const rect = svg.getBoundingClientRect();
  const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
  const i = Math.max(0, Math.min(st.n - 1, Math.round((clientX - rect.left - st.padL) / st.iw * (st.n - 1))));
  const q = st.pts[i], x = st.X(i);
  const cx = svg.querySelector(".cx"), cd = svg.querySelector(".cd");
  cx.setAttribute("x1", x); cx.setAttribute("x2", x); cx.setAttribute("visibility", "visible");
  cd.setAttribute("cx", x); cd.setAttribute("cy", st.Y(q[1])); cd.setAttribute("visibility", "visible");
  const base = baseOf(s.d, s.r), b = base ? base * s.c.f : st.pts[0][1];
  const pc = (q[1] - b) / b * 100;
  if (svg._tip) svg._tip.textContent = fmtFull(q[0], s.r) + " · " + fmt(q[1], s.c.cur) + " · " + (pc >= 0 ? "+" : "") + pc.toFixed(2) + "%";
  if (ev.touches && ev.cancelable) ev.preventDefault();
}
function endScrub(ev){
  const svg = ev.currentTarget;
  svg.querySelectorAll(".cx,.cd").forEach((e) => e.setAttribute("visibility", "hidden"));
  setIdleTip(svg);
}

const ro = new ResizeObserver((entries) => entries.forEach((e) => drawChart(e.target)));
function setupChart(svg, tip, touch){
  svg._tip = tip;
  svg.addEventListener("mousemove", scrub);
  svg.addEventListener("mouseleave", endScrub);
  if (touch){ // solo nel dettaglio: nelle card il tocco deve poter scorrere la pagina
    svg.addEventListener("touchstart", scrub, { passive: false });
    svg.addEventListener("touchmove", scrub, { passive: false });
    svg.addEventListener("touchend", endScrub);
  }
  ro.observe(svg);
}

// ---------- lista ----------
async function renderList(){
  const list = $("list");
  if (!watch.length){
    list.innerHTML = '<div class="empty">Nessun titolo. Tocca + per aggiungerne uno.</div>';
    return;
  }
  list.querySelectorAll("svg").forEach((s) => ro.unobserve(s));
  // scheletro
  list.innerHTML = watch.map((w, i) => `
    <div class="card" data-i="${i}">
      <div class="chead">
        <div><div class="nm"></div><div class="sym"></div></div>
        <div class="r"><div class="px">…</div><div class="chg"></div></div>
      </div>
      <div class="ctip"></div>
      <svg class="chart"></svg>
    </div>`).join("");
  list.querySelectorAll(".card").forEach((el) => {
    const w = watch[+el.dataset.i];
    el.querySelector(".nm").textContent = w.label || w.symbol;
    el.querySelector(".sym").textContent = w.symbol;
    el.onclick = () => openDetail(w.symbol);
    setupChart(el.querySelector("svg"), el.querySelector(".ctip"), false);
  });

  await Promise.all(watch.map(async (w, i) => {
    const el = list.querySelector(`.card[data-i="${i}"]`);
    try {
      const d = await getChart(w.symbol, range);
      const c = await conv(d);
      const p = change(d, range);
      el.querySelector(".px").textContent = fmt(d.price * c.f, c.cur);
      el.querySelector(".chg").innerHTML = pillHtml(p);
      el.querySelector(".sym").textContent = w.symbol + (d.exchange ? " · " + d.exchange : "");
      const svg = el.querySelector("svg");
      svg._data = { d, c, p, r: range };
      drawChart(svg);
    } catch(e){
      el.querySelector(".px").textContent = "n/d";
      el.querySelector(".chg").innerHTML = '<span class="err"></span>';
      el.querySelector(".err").textContent = e.message;
    }
  }));
  $("updated").textContent = "Aggiornato alle " + new Date().toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
}

function setSeg(segId, val){
  $(segId).querySelectorAll("button").forEach((b) => b.classList.toggle("on", b.dataset.v === val));
}

// ---------- dettaglio ----------
setupChart($("bigChart"), $("tip"), true);

async function openDetail(symbol){
  detailSym = symbol;
  detailRange = range;
  const w = watch.find((x) => x.symbol === symbol);
  $("dName").textContent = (w && w.label) || symbol;
  $("dMeta").textContent = symbol;
  $("dPrice").textContent = "…"; $("dChg").textContent = ""; $("bigChart").innerHTML = ""; $("tip").textContent = ""; $("stats").innerHTML = "";
  $("bigChart")._data = null;
  $("detail").classList.add("open");
  setSeg("dRangeSeg", detailRange);
  await renderDetail();
}

async function renderDetail(){
  const sym = detailSym, r = detailRange;
  try {
    const d = await getChart(sym, r);
    if (sym !== detailSym || r !== detailRange) return;
    const c = await conv(d);
    const p = change(d, r);
    const base = baseOf(d, r);
    $("dMeta").textContent = [sym, d.name !== sym ? d.name : "", d.exchange, isIndex(d) ? "punti" : (normCur(d).cur + (c.cur && c.cur !== normCur(d).cur ? " → " + c.cur : ""))].filter(Boolean).join(" · ");
    $("dPrice").textContent = fmt(d.price * c.f, c.cur);
    const abs = base ? (d.price - base) * c.f : null;
    const labels = { "1d": "oggi", "1w": "1 settimana", "1m": "1 mese", "1y": "1 anno" };
    $("dChg").innerHTML = p == null ? "" :
      `<span style="color:${colorFor(p)}">${abs >= 0 ? "+" : ""}${fmt(abs, c.cur)} (${p >= 0 ? "+" : ""}${p.toFixed(2)}%)</span> <span class="dmeta">${labels[r]}</span>`;
    const svg = $("bigChart");
    svg._data = { d, c, p, r };
    drawChart(svg);
    renderStats(d, c, r, base);
  } catch(e){
    $("dPrice").textContent = "n/d";
    $("dChg").innerHTML = '<span class="err"></span>';
    $("dChg").querySelector(".err").textContent = "Impossibile caricare i dati: " + e.message;
  }
}

function renderStats(d, c, r, base){
  const vals = d.points.map((x) => x[1] * c.f);
  const hi = vals.length ? Math.max(...vals) : null, lo = vals.length ? Math.min(...vals) : null;
  const items = [
    [r === "1d" ? "Chiusura prec." : "Inizio periodo", base != null ? fmt(base * c.f, c.cur) : "—"],
    ["Massimo periodo", fmt(hi, c.cur)],
    ["Minimo periodo", fmt(lo, c.cur)],
    ["Escursione", hi != null && lo ? ((hi - lo) / lo * 100).toFixed(2) + "%" : "—"],
    ["Ultimo prezzo", d.marketTime ? fmtFull(d.marketTime, "1d") : "—"],
  ];
  $("stats").innerHTML = items.map(() => '<div class="stat"><div class="k"></div><div class="v"></div></div>').join("");
  $("stats").querySelectorAll(".stat").forEach((el, i) => {
    el.querySelector(".k").textContent = items[i][0];
    el.querySelector(".v").textContent = items[i][1];
  });
}

// ---------- aggiunta ----------
let searchTimer = null;
$("addBtn").onclick = () => {
  $("adder").classList.add("open");
  $("q").value = ""; $("results").innerHTML = "";
  setTimeout(() => $("q").focus(), 50);
};
$("q").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const v = $("q").value.trim();
  if (!v){ $("results").innerHTML = ""; return; }
  searchTimer = setTimeout(() => doSearch(v), 300);
});
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter"){ const v = $("q").value.trim().toUpperCase(); if (v) addSymbol(v, v); }
});
async function doSearch(v){
  try {
    const res = await fetch("/api/search?q=" + encodeURIComponent(v));
    const d = await res.json();
    if ($("q").value.trim() !== v) return;
    const box = $("results");
    box.innerHTML = "";
    if (!d.results.length){ box.innerHTML = '<div class="hint">Nessun risultato.</div>'; return; }
    d.results.forEach((x) => {
      const el = document.createElement("div");
      el.className = "res";
      el.innerHTML = '<div><div class="a"></div><div class="dmeta"></div></div><div class="b"></div>';
      el.querySelector(".a").textContent = x.symbol;
      el.querySelector(".dmeta").textContent = x.name;
      el.querySelector(".b").textContent = [x.exchange, x.type].filter(Boolean).join(" · ");
      el.onclick = () => addSymbol(x.symbol, shortName(x.name));
      box.appendChild(el);
    });
  } catch(e){ $("results").innerHTML = '<div class="hint">Errore nella ricerca.</div>'; }
}
function shortName(n){
  return n.replace(/,?\s+(Inc\.?|Corporation|Corp\.?|Ltd\.?|S\.p\.A\.?|SpA|N\.V\.|AG|SE|plc|Class [A-C])\b.*$/i, "").trim() || n;
}
function addSymbol(symbol, label){
  if (!watch.some((w) => w.symbol === symbol)){
    watch.push({ symbol, label });
    save("borsa.watch", watch);
  }
  $("adder").classList.remove("open");
  renderList();
}

$("removeBtn").onclick = () => {
  watch = watch.filter((w) => w.symbol !== detailSym);
  save("borsa.watch", watch);
  $("detail").classList.remove("open");
  renderList();
};

// ---------- controlli ----------
document.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => b.closest(".sheet").classList.remove("open"));
document.querySelectorAll(".sheet").forEach((s) => s.addEventListener("click", (e) => { if (e.target === s) s.classList.remove("open"); }));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".sheet.open").forEach((s) => s.classList.remove("open")); });

$("rangeSeg").onclick = (e) => {
  const v = e.target.dataset.v; if (!v) return;
  range = v; save("borsa.range", v); setSeg("rangeSeg", v); renderList();
};
$("curSeg").onclick = (e) => {
  const v = e.target.dataset.v; if (!v) return;
  cur = v; save("borsa.cur", v); setSeg("curSeg", v); renderList();
  if ($("detail").classList.contains("open")) renderDetail();
};
$("dRangeSeg").onclick = (e) => {
  const v = e.target.dataset.v; if (!v) return;
  detailRange = v; setSeg("dRangeSeg", v); renderDetail();
};

// ---------- invito all'installazione ----------
(() => {
  const installed = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const android = /Android/.test(navigator.userAgent);
  // iPadOS si presenta come "MacIntel" con touch
  const ios = !android && (/iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1));
  const mobile = ios || android;
  if (installed || !mobile || load("borsa.installDismissed", false)) return;
  const box = $("install");
  $("installNo").onclick = () => { box.classList.remove("open"); save("borsa.installDismissed", true); };
  if (ios){ // iOS non ha un'API di installazione: si spiega come fare
    $("installMsg").textContent = "Tocca Condividi (□↑), poi “Aggiungi alla schermata Home”.";
    $("installGo").hidden = true;
    box.classList.add("open");
    return;
  }
  // Android/Chrome: il banner appare solo quando il browser rende disponibile il prompt nativo
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    $("installMsg").textContent = "Aprila dalla schermata Home, a tutto schermo.";
    $("installGo").onclick = async () => { box.classList.remove("open"); e.prompt(); await e.userChoice; };
    box.classList.add("open");
  });
  window.addEventListener("appinstalled", () => box.classList.remove("open"));
})();

setSeg("rangeSeg", range);
setSeg("curSeg", cur);
renderList();
setInterval(() => { if (!document.hidden) renderList(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderList(); });
</script>
</body>
