<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="theme-color" content="#001E2B">

<link rel="icon" href="/icon-192.png">

<title>StocksWatcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<script>
// tema prima del primo paint, per evitare il lampo chiaro
try { const t = JSON.parse(localStorage.getItem("borsa.theme")); if (t === "dark" || t === "light") document.documentElement.dataset.theme = t; } catch(e){}
</script>
<style>
/* Ispirato a LeafyGreen (MongoDB). Contrasti verificati WCAG AA: testo >= 4.5:1, grafica e stati >= 3:1 */
:root{
  --bg:#F9FBFA; --card:#FFFFFF; --text:#001E2B; --muted:#5C6C75; --line:#E8EDEB; --grid:#E8EDEB; --field:#889397;
  --chip:#E8EDEB; --segOn:#00684A; --segOnText:#FFFFFF;
  --up:#00684A; --down:#C2261F; --accent:#016BF8; --focus:#016BF8; --primary:#00684A; --primaryHover:#00593F; --onPrimary:#FFFFFF;
  --upBg:#E3FCF7; --upFg:#00593F; --upBd:#C0FAE6; --downBg:#FFEAE5; --downFg:#970606; --downBd:#FFCDC7;
  --flatBg:#E8EDEB; --flatFg:#3D4F58; --flatBd:#C1C7C6;
  --shadow:0 4px 10px -4px rgba(0,30,43,.18); --overlay:rgba(0,30,43,.6);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#001E2B; --card:#112733; --text:#E8EDEB; --muted:#A6B0B4; --line:#3D4F58; --grid:#1C2D38; --field:#889397;
    --chip:#1C2D38; --segOn:#00ED64; --segOnText:#001E2B;
    --up:#00ED64; --down:#FF6960; --accent:#0498EC; --focus:#0498EC; --primary:#00684A; --primaryHover:#00593F; --onPrimary:#FFFFFF;
    --upBg:#023430; --upFg:#71F6BA; --upBd:#00684A; --downBg:#5B0000; --downFg:#FFCDC7; --downBd:#970606;
    --flatBg:#1C2D38; --flatFg:#C1C7C6; --flatBd:#3D4F58;
    --shadow:none; --overlay:rgba(0,0,0,.7); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#001E2B; --card:#112733; --text:#E8EDEB; --muted:#A6B0B4; --line:#3D4F58; --grid:#1C2D38; --field:#889397;
  --chip:#1C2D38; --segOn:#00ED64; --segOnText:#001E2B;
  --up:#00ED64; --down:#FF6960; --accent:#0498EC; --focus:#0498EC; --primary:#00684A; --primaryHover:#00593F; --onPrimary:#FFFFFF;
  --upBg:#023430; --upFg:#71F6BA; --upBd:#00684A; --downBg:#5B0000; --downFg:#FFCDC7; --downBd:#970606;
  --flatBg:#1C2D38; --flatFg:#C1C7C6; --flatBd:#3D4F58;
  --shadow:none; --overlay:rgba(0,0,0,.7); color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 "DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}
.wrap{padding:16px clamp(16px,2.5vw,48px) calc(80px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 16px}
h1{font:600 32px/1.1 "Source Serif 4",Georgia,serif;margin:0;letter-spacing:-.01em}
@media (max-width:420px){ h1{font-size:26px} }
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.hbtns{display:flex;gap:8px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--text);width:40px;height:40px;border-radius:50%;
  font-size:20px;line-height:1;cursor:pointer;padding:0;display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--chip)}
.iconbtn.lang{font-size:12px;font-weight:700;letter-spacing:.04em}
#addBtn{background:var(--primary);border-color:var(--primary);color:var(--onPrimary)}
#addBtn:hover{background:var(--primaryHover)}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600;
  padding:6px 12px;border-radius:6px;cursor:pointer;min-height:32px}
.seg button:hover{color:var(--text)}
.seg button[aria-pressed="true"]{background:var(--segOn);color:var(--segOnText)}
.list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:16px}
@media (max-width:600px){ .list{grid-template-columns:1fr;gap:12px} }
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 8px;box-shadow:var(--shadow);
  cursor:pointer;min-width:0;transition:border-color .15s}
.card:hover{border-color:var(--field)}
.chead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.chead{width:100%;border:0;background:transparent;padding:0;text-align:left;cursor:pointer;border-radius:8px;flex:1;min-width:0}
.crow{display:flex;gap:4px;align-items:center}
.grip{flex:none;width:28px;height:40px;margin-left:-8px;border:0;background:transparent;color:var(--muted);font-size:18px;
  border-radius:6px;cursor:grab;touch-action:none}
.grip:hover{background:var(--chip);color:var(--text)}
.card.dragging{outline:2px dashed var(--focus);outline-offset:2px;opacity:.9}
.card.dragging .grip{cursor:grabbing}
.chead > span:first-child{min-width:0}
.nm,.sym,.px,.chg,.res .a,.res .dmeta{display:block}
.nm{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sym{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r{text-align:right;white-space:nowrap}
.px{font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.ctip{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums;min-height:18px;margin:8px 0 2px}
svg.chart{display:block;width:100%;height:clamp(170px,26vh,380px);touch-action:pan-y}
svg.chart .ax{fill:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.pill{display:inline-block;margin-top:4px;font-size:13px;font-weight:600;padding:1px 9px;border-radius:24px;border:1px solid;
  font-variant-numeric:tabular-nums}
.up{background:var(--upBg);color:var(--upFg);border-color:var(--upBd)}
.down{background:var(--downBg);color:var(--downFg);border-color:var(--downBd)}
.flat{background:var(--flatBg);color:var(--flatFg);border-color:var(--flatBd)}
.more,.chev{display:none}
@media (max-width:600px){
  /* mobile: card chiuse, il tap sull'intestazione le apre */
  .card{padding-bottom:16px}
  .card:not(.open) .ctip,.card:not(.open) svg.chart{display:none}
  .card.open .more{display:block}
  .more{border:1px solid var(--line);background:var(--chip);color:var(--text);font-weight:600;font-size:14px;border-radius:6px;
    padding:10px;width:100%;margin-top:10px;cursor:pointer}
  .chev{display:block;align-self:center;color:var(--muted);font-size:22px;line-height:1;transition:transform .15s}
  .card.open .chev{transform:rotate(90deg)}
}
.welcome{grid-column:1/-1;max-width:560px;width:100%;margin:24px auto;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.welcome img{width:56px;height:56px;border-radius:14px}
.welcome h2{font:600 26px/1.2 "Source Serif 4",Georgia,serif;margin:16px 0 8px}
.welcome p{margin:0 0 14px;color:var(--muted)}
.welcome ol{margin:0 0 20px;padding-left:22px} .welcome li{margin-bottom:8px}
.go{border:1px solid var(--primary);background:var(--primary);color:var(--onPrimary);font-weight:600;border-radius:6px;
  padding:10px 16px;cursor:pointer;min-height:40px}
.go:hover{background:var(--primaryHover)}
.welcome .hint{margin:14px 0 0}
.err{color:var(--down);font-size:13px}
/* finestre centrate; sotto restano ~72px liberi per il badge Netlify, che copre l'angolo in basso */
.sheet{position:fixed;inset:0;background:var(--overlay);display:none;align-items:center;justify-content:center;z-index:10;
  padding:calc(16px + env(safe-area-inset-top)) 12px calc(72px + env(safe-area-inset-bottom))}
.sheet.open{display:flex}
.panel{background:var(--bg);border:1px solid var(--line);width:100%;max-width:640px;max-height:100%;overflow:auto;border-radius:16px;padding:16px}
.panel.wide{max-width:1400px}
@media (min-width:900px){ .panel{width:92vw;padding:24px 28px 28px} }
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.dname{font:600 26px/1.2 "Source Serif 4",Georgia,serif;margin:0}
.dmeta{color:var(--muted);font-size:13px}
.dprice{font-size:34px;font-weight:700;margin:12px 0 0;font-variant-numeric:tabular-nums}
.dchg{font-weight:600;font-variant-numeric:tabular-nums}
.chartbox{background:var(--card);border:1px solid var(--line);border-radius:16px;margin:14px 0;padding:10px 14px 8px;box-shadow:var(--shadow)}
.chartbox .ctip{margin:2px 0 4px}
.ctop{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.zoom{display:inline-flex;gap:4px}
.zoom button{border:1px solid var(--line);background:var(--card);color:var(--text);min-width:32px;height:32px;border-radius:6px;
  font-size:13px;font-weight:600;cursor:pointer;padding:0 10px}
.zoom button:hover:not(:disabled){background:var(--chip)}
.zoom button:disabled{color:var(--muted);cursor:default;opacity:.6}
#bigChart.zoomed{cursor:grab}
#bigChart{height:clamp(260px,52vh,640px);touch-action:none}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .k{color:var(--muted);font-size:13px} .stat .v{font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.danger{border:0;background:transparent;color:var(--down);font-weight:600;padding:10px 0;cursor:pointer;text-underline-offset:3px}
.danger:hover{text-decoration:underline}
.search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:6px;border:1px solid var(--field);
  background:var(--card);color:var(--text)}
.search::placeholder{color:var(--muted);opacity:1}
.search:focus-visible{outline:2px solid var(--focus);outline-offset:1px;border-color:var(--focus)}
.res{display:flex;width:100%;text-align:left;justify-content:space-between;gap:10px;padding:12px 6px;border:0;
  border-bottom:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer}
.res:hover{background:var(--chip)}
.res .a{font-weight:600} .res .b{color:var(--muted);font-size:13px;text-align:right}
.hint{color:var(--muted);font-size:13px;margin-top:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }
</style>
</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <h1>StocksWatcher</h1>
      <div class="sub" id="updated">—</div>
    </div>
    <div class="hbtns">
      <button class="iconbtn lang" id="langBtn"></button>
      <button class="iconbtn" id="themeBtn"></button>
      <button class="iconbtn" id="addBtn" data-i18n-aria="add"><span aria-hidden="true">+</span></button>
    </div>
  </header>

  <div class="controls">
    <div class="seg" id="rangeSeg" role="group" data-i18n-aria="periodLabel">
      <button data-v="1d" data-i18n="r1d"></button><button data-v="1w" data-i18n="r1w"></button><button data-v="1m" data-i18n="r1m"></button><button data-v="1y" data-i18n="r1y"></button>
    </div>
    <div class="seg" id="curSeg" role="group" data-i18n-aria="curLabel">
      <button data-v="orig" data-i18n="orig"></button><button data-v="EUR" aria-label="EUR">€</button><button data-v="USD" aria-label="USD">$</button>
    </div>
  </div>

  <main class="list" id="list"></main>
  <span class="sr" id="gripHint" data-i18n="reorderHint"></span>
  <div class="sr" id="announce" aria-live="assertive"></div>
</div>

<!-- dettaglio -->
<div class="sheet" id="detail">
  <div class="panel wide" role="dialog" aria-modal="true" aria-labelledby="dName">
    <div class="dhead">
      <div>
        <h2 class="dname" id="dName"></h2>
        <div class="dmeta" id="dMeta"></div>
      </div>
      <button class="iconbtn" data-close data-i18n-aria="close"><span aria-hidden="true">×</span></button>
    </div>
    <div class="dprice" id="dPrice"></div>
    <div class="dchg" id="dChg"></div>
    <div class="seg" id="dRangeSeg" style="margin-top:12px" role="group" data-i18n-aria="periodLabel">
      <button data-v="1d" data-i18n="r1d"></button><button data-v="1w" data-i18n="r1w"></button><button data-v="1m" data-i18n="r1m"></button><button data-v="1y" data-i18n="r1y"></button>
    </div>
    <div class="chartbox">
      <div class="ctop">
        <div class="ctip" id="tip"></div>
        <div class="zoom" role="group" data-i18n-aria="zoomLabel">
          <button type="button" id="zoomIn" data-i18n-aria="zoomIn"><span aria-hidden="true">+</span></button>
          <button type="button" id="zoomOut" data-i18n-aria="zoomOut"><span aria-hidden="true">−</span></button>
          <button type="button" id="zoomReset" data-i18n="zoomReset"></button>
        </div>
      </div>
      <svg class="chart" id="bigChart"></svg>
    </div>
    <div class="stats" id="stats"></div>
    <button type="button" class="danger" id="removeBtn" data-i18n="remove"></button>
  </div>
</div>

<!-- aggiunta -->
<div class="sheet" id="adder">
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="adderTitle">
    <div class="dhead" style="margin-bottom:10px">
      <h2 class="dname" id="adderTitle" data-i18n="add"></h2>
      <button class="iconbtn" data-close data-i18n-aria="close"><span aria-hidden="true">×</span></button>
    </div>
    <input class="search" id="q" type="search" data-i18n-ph="searchPh" data-i18n-aria="add" aria-describedby="qHint" autocomplete="off" autocapitalize="off">
    <div id="results" role="status" aria-live="polite"></div>
    <div class="hint" id="qHint" data-i18n="searchHint"></div>
  </div>
</div>

<script>

function load(key, fallback){ try{ const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }catch(e){ return fallback; } }
function save(key, val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }

let watch = load("borsa.watch", []);
let range = load("borsa.range", "1d");
let cur = load("borsa.cur", "EUR");
let theme = load("borsa.theme", "auto");
let detailSym = null, detailRange = "1d";
const cache = {};   // key symbol|range -> data
const fx = {};      // "USDEUR" -> rate

const $ = (id) => document.getElementById(id);

// ---------- lingua ----------
const I18N = {
  it: {
    r1d: "1G", r1w: "1S", r1m: "1M", r1y: "1A", orig: "Orig.", add: "Aggiungi titolo", close: "Chiudi",
    remove: "Rimuovi dalla lista", searchPh: "Nome o ticker (es. Nvidia, ENEL.MI, ^IXIC)",
    searchHint: "Puoi anche scrivere direttamente un ticker Yahoo Finance e premere Invio.",
    themeAuto: "Tema: automatico", themeDark: "Tema: scuro", themeLight: "Tema: chiaro", lang: "Lingua: italiano",
    noData: "Dati non disponibili", unavailable: "dati non disponibili", loadErr: "Impossibile caricare i dati",
    updated: "Aggiornato alle ", details: "Dettagli ›",
    welcomeTitle: "Benvenuto in StocksWatcher",
    welcomeIntro: "Segui azioni, ETF, indici e cambi di tutto il mondo in un'unica lista.",
    step1: "Premi + e cerca un titolo per nome o ticker: Nvidia, ENEL.MI, ^GSPC.",
    step2: "Scegli il periodo (1G, 1S, 1M, 1A) e la valuta in cui vedere i prezzi.",
    step3: "Apri una card per il grafico completo con massimi, minimi e variazioni.",
    addFirst: "Aggiungi il primo titolo", welcomeNote: "La lista resta salvata su questo dispositivo.",
    prevClose: "Chiusura prec.", periodStart: "Inizio periodo", high: "Massimo periodo", low: "Minimo periodo",
    periodLabel: "Periodo", curLabel: "Valuta",
    reorder: "Sposta", reorderHint: "Trascina, oppure usa le frecce su e giù per cambiare posizione.", position: "posizione", of: "di",
    zoomLabel: "Zoom", zoomIn: "Ingrandisci", zoomOut: "Riduci", zoomReset: "Reimposta",
    rangePct: "Escursione", lastPrice: "Ultimo prezzo", noResults: "Nessun risultato.", searchErr: "Errore nella ricerca.",
    points: "punti", chg1d: "oggi", chg1w: "1 settimana", chg1m: "1 mese", chg1y: "1 anno",
  },
  en: {
    r1d: "1D", r1w: "1W", r1m: "1M", r1y: "1Y", orig: "Orig.", add: "Add symbol", close: "Close",
    remove: "Remove from list", searchPh: "Name or ticker (e.g. Nvidia, ENEL.MI, ^IXIC)",
    searchHint: "You can also type a Yahoo Finance ticker directly and press Enter.",
    themeAuto: "Theme: automatic", themeDark: "Theme: dark", themeLight: "Theme: light", lang: "Language: English",
    noData: "No data available", unavailable: "data unavailable", loadErr: "Couldn't load data",
    updated: "Updated at ", details: "Details ›",
    welcomeTitle: "Welcome to StocksWatcher",
    welcomeIntro: "Follow stocks, ETFs, indices and currencies from around the world in one list.",
    step1: "Press + and search by name or ticker: Nvidia, ENEL.MI, ^GSPC.",
    step2: "Pick the period (1D, 1W, 1M, 1Y) and the currency for prices.",
    step3: "Open a card for the full chart with highs, lows and changes.",
    addFirst: "Add your first symbol", welcomeNote: "Your list is saved on this device.",
    prevClose: "Prev. close", periodStart: "Period start", high: "Period high", low: "Period low",
    periodLabel: "Period", curLabel: "Currency",
    reorder: "Move", reorderHint: "Drag, or use the up and down arrow keys to change position.", position: "position", of: "of",
    zoomLabel: "Zoom", zoomIn: "Zoom in", zoomOut: "Zoom out", zoomReset: "Reset",
    rangePct: "Range", lastPrice: "Last price", noResults: "No results.", searchErr: "Search error.",
    points: "points", chg1d: "today", chg1w: "1 week", chg1m: "1 month", chg1y: "1 year",
  },
};
const LANGS = Object.keys(I18N);
let lang = load("borsa.lang", null);
if (!I18N[lang]) lang = LANGS.find((l) => (navigator.language || "").toLowerCase().startsWith(l)) || "en";
let LOC = "it-IT";
const t = (k) => I18N[lang][k] ?? I18N.it[k] ?? k;
function applyLang(){
  // formato di date e numeri: quello del browser se è della stessa lingua (es. en-GB), altrimenti il default
  LOC = (navigator.language || "").toLowerCase().startsWith(lang) ? navigator.language : { it: "it-IT", en: "en-US" }[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach((e) => e.textContent = t(e.dataset.i18n));
  document.querySelectorAll("[data-i18n-aria]").forEach((e) => e.setAttribute("aria-label", t(e.dataset.i18nAria)));
  document.querySelectorAll("[data-i18n-ph]").forEach((e) => e.placeholder = t(e.dataset.i18nPh));
  $("langBtn").textContent = lang.toUpperCase();
  $("langBtn").title = t("lang"); $("langBtn").setAttribute("aria-label", t("lang"));
}
applyLang();

// ---------- tema ----------
const THEMES = { auto: ["◐", "themeAuto"], dark: ["☾", "themeDark"], light: ["☀", "themeLight"] };
function applyTheme(){
  if (theme === "auto") delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = theme;
  $("themeBtn").textContent = THEMES[theme][0];
  $("themeBtn").title = $("themeBtn").ariaLabel = t(THEMES[theme][1]);
}
$("themeBtn").onclick = () => {
  theme = { auto: "dark", dark: "light", light: "auto" }[theme] || "auto";
  save("borsa.theme", theme); applyTheme();
};
applyTheme();
$("langBtn").onclick = () => {
  lang = LANGS[(LANGS.indexOf(lang) + 1) % LANGS.length];
  save("borsa.lang", lang); applyLang(); applyTheme(); renderList();
  if ($("detail").classList.contains("open")) renderDetail();
};

async function getChart(symbol, r){
  const key = symbol + "|" + r;
  const c = cache[key];
  if (c && Date.now() - c.t < 60000) return c.d;
  const res = await fetch("/api/chart?symbol=" + encodeURIComponent(symbol) + "&range=" + r);
  const d = await res.json();
  if (!res.ok) throw new Error(d.error || "errore");
  cache[key] = { t: Date.now(), d };
  return d;
}

function normCur(d){
  // Borsa di Londra quota in pence
  if (d.currency === "GBp" || d.currency === "GBX") return { cur: "GBP", k: 0.01 };
  if (d.currency === "ZAc") return { cur: "ZAR", k: 0.01 };
  if (d.currency === "ILA") return { cur: "ILS", k: 0.01 };
  return { cur: d.currency, k: 1 };
}

function isIndex(d){ return d.symbol.startsWith("^") || d.instrumentType === "INDEX"; }

async function getRate(from, to){
  if (!from || from === to) return 1;
  const k = from + to;
  if (fx[k] && Date.now() - fx[k].t < 300000) return fx[k].v;
  const d = await getChart(from + to + "=X", "1d");
  fx[k] = { t: Date.now(), v: d.price };
  return d.price;
}

// restituisce {factor, cur} per convertire i valori nella valuta scelta
async function conv(d){
  if (isIndex(d)) return { f: 1, cur: null };
  const n = normCur(d);
  if (cur === "orig") return { f: n.k, cur: n.cur };
  const rate = await getRate(n.cur, cur);
  return { f: n.k * rate, cur: cur };
}

function fmt(v, c){
  if (v == null || isNaN(v)) return "—";
  const dec = Math.abs(v) < 10 ? 3 : 2;
  if (!c) return v.toLocaleString(LOC, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  try { return v.toLocaleString(LOC, { style: "currency", currency: c, minimumFractionDigits: dec, maximumFractionDigits: dec }); }
  catch(e){ return v.toFixed(dec) + " " + c; }
}

function baseOf(d, r){ return r === "1d" ? d.prevClose : (d.points.length ? d.points[0][1] : null); }

function change(d, r){
  const base = baseOf(d, r);
  if (!base) return null;
  return (d.price - base) / base * 100;
}

// percentuale con segno, separatore decimale della lingua
function pct(v, signed = true){ return (signed && v >= 0 ? "+" : "") + v.toLocaleString(LOC, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + "%"; }

function pillHtml(p){
  if (p == null) return '<span class="pill flat">—</span>';
  const cls = p > 0.004 ? "up" : p < -0.004 ? "down" : "flat";
  return `<span class="pill ${cls}">${pct(p)}</span>`;
}

function colorFor(p){ return p == null ? "var(--muted)" : p >= 0 ? "var(--up)" : "var(--down)"; }

// ---------- grafico con assi ----------
function niceStep(span, n){
  const raw = span / Math.max(1, n), mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const k = raw / mag;
  return (k <= 1 ? 1 : k <= 2 ? 2 : k <= 5 ? 5 : 10) * mag;
}

// etichetta asse X: chiave di raggruppamento (un tick quando cambia) e testo
function xKey(t, r){
  const d = new Date(t);
  if (r === "1d") return d.getHours();
  if (r === "1y") return d.getFullYear() * 12 + d.getMonth();
  return d.toDateString();
}
function xLabel(t, r){
  const d = new Date(t);
  if (r === "1d") return d.toLocaleTimeString(LOC, { hour: "2-digit", minute: "2-digit" });
  if (r === "1w") return d.toLocaleDateString(LOC, { weekday: "short", day: "numeric" });
  if (r === "1y") return d.toLocaleDateString(LOC, { month: "short" }) + (d.getMonth() === 0 ? " " + d.getFullYear() : "");
  return d.toLocaleDateString(LOC, { day: "numeric", month: "short" });
}
function fmtFull(t, r){
  const d = new Date(t);
  const day = d.toLocaleDateString(LOC, { weekday: "short", day: "numeric", month: "short", year: r === "1y" ? "numeric" : undefined });
  return r === "1d" || r === "1w" ? day + ", " + d.toLocaleTimeString(LOC, { hour: "2-digit", minute: "2-digit" }) : day;
}

let gradId = 0;
// svg._data = { d, c, p, r }; ridisegna alla dimensione reale dell'elemento (testo nitido)
function drawChart(svg){
  const s = svg._data; if (!s) return;
  const { d, c, p, r } = s;
  const W = svg.clientWidth, H = svg.clientHeight;
  if (!W || !H) return;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const padL = 4, padR = 64, padT = 8, padB = 22;
  let pts = d.points.map((x) => [x[0], x[1] * c.f]);
  if (svg._view) pts = pts.slice(svg._view[0], svg._view[1] + 1); // zoom: solo la finestra visibile
  const n = pts.length;
  if (n < 2){ svg.innerHTML = `<text class="ax" x="${W / 2}" y="${H / 2}" text-anchor="middle">${t("noData")}</text>`; svg._st = null; return; }

  let min = Infinity, max = -Infinity;
  for (const q of pts){ if (q[1] < min) min = q[1]; if (q[1] > max) max = q[1]; }
  const baseLine = r === "1d" && d.prevClose ? d.prevClose * c.f : null;
  if (baseLine != null){ min = Math.min(min, baseLine); max = Math.max(max, baseLine); }
  const padV = (max - min) * 0.06 || Math.abs(max) * 0.01 || 1; min -= padV; max += padV;

  const iw = W - padL - padR, ih = H - padT - padB;
  // asse X per indice: niente buchi per notti e weekend
  const X = (i) => padL + i / (n - 1) * iw;
  const Y = (v) => padT + (1 - (v - min) / (max - min)) * ih;

  const step = niceStep(max - min, Math.max(2, Math.floor(ih / 42)));
  const dec = Math.max(0, -Math.floor(Math.log10(step) + 1e-9));
  let grid = "";
  for (let v = Math.ceil(min / step) * step; v <= max; v += step){
    const y = Y(v).toFixed(1);
    grid += `<line x1="${padL}" x2="${W - padR}" y1="${y}" y2="${y}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text class="ax" x="${W - padR + 8}" y="${+y + 4}">${v.toLocaleString(LOC, { minimumFractionDigits: dec, maximumFractionDigits: dec })}</text>`;
  }

  let ticks = [];
  for (let i = 1; i < n; i++) if (xKey(pts[i][0], r) !== xKey(pts[i - 1][0], r)) ticks.push(i);
  if (r === "1d" || r === "1m") ticks.unshift(0);
  const maxT = Math.max(2, Math.floor(iw / 80));
  if (ticks.length > maxT){ const k = Math.ceil(ticks.length / maxT); ticks = ticks.filter((_, j) => j % k === 0); }
  for (const i of ticks){
    const x = X(i);
    if (x > W - padR - 20) continue;
    grid += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${padT}" y2="${H - padB}" stroke="var(--grid)" stroke-width="1"/>` +
      `<text class="ax" x="${Math.max(x, padL + 14).toFixed(1)}" y="${H - 6}" text-anchor="middle">${xLabel(pts[i][0], r)}</text>`;
  }

  const col = colorFor(p), gid = "g" + (++gradId);
  const line = pts.map((q, i) => (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(q[1]).toFixed(1)).join("");
  const area = line + `L${X(n - 1).toFixed(1)},${H - padB}L${X(0).toFixed(1)},${H - padB}Z`;
  svg.innerHTML = `
    <defs><linearGradient id="${gid}" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/>
    </linearGradient></defs>
    ${grid}
    ${baseLine != null ? `<line x1="${padL}" x2="${W - padR}" y1="${Y(baseLine)}" y2="${Y(baseLine)}" stroke="var(--muted)" stroke-dasharray="3 4" stroke-width="1"/>` : ""}
    <path d="${area}" fill="url(#${gid})"/>
    <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
    <line class="cx" y1="${padT}" y2="${H - padB}" stroke="var(--muted)" stroke-width="1" visibility="hidden"/>
    <circle class="cd" r="4" fill="${col}" visibility="hidden"/>`;
  svg._st = { pts, X, Y, n, padL, iw };
  const vals = pts.map((q) => q[1]);
  svg.setAttribute("role", "img");
  svg.setAttribute("aria-label", `${d.name || d.symbol}, ${t("chg" + r)}: ${p != null ? pct(p) : "—"} · Max ${fmt(Math.max(...vals), c.cur)} · Min ${fmt(Math.min(...vals), c.cur)}`);
  setIdleTip(svg);
}

function setIdleTip(svg){
  const s = svg._data, st = svg._st;
  if (!svg._tip || !s || !st) return;
  const vals = st.pts.map((q) => q[1]);
  svg._tip.textContent = "Max " + fmt(Math.max(...vals), s.c.cur) + " · Min " + fmt(Math.min(...vals), s.c.cur);
}

function scrub(ev){
  const svg = ev.currentTarget, st = svg._st, s = svg._data;
  if (!st) return;
  const rect = svg.getBoundingClientRect();
  if (ev.touches && ev.touches.length > 1) return; // due dita = pinch, non tooltip
  const clientX = ev.touches ? ev.touches[0].clientX : ev.clientX;
  const i = Math.max(0, Math.min(st.n - 1, Math.round((clientX - rect.left - st.padL) / st.iw * (st.n - 1))));
  const q = st.pts[i], x = st.X(i);
  const cx = svg.querySelector(".cx"), cd = svg.querySelector(".cd");
  cx.setAttribute("x1", x); cx.setAttribute("x2", x); cx.setAttribute("visibility", "visible");
  cd.setAttribute("cx", x); cd.setAttribute("cy", st.Y(q[1])); cd.setAttribute("visibility", "visible");
  const base = baseOf(s.d, s.r), b = base ? base * s.c.f : st.pts[0][1];
  const pc = (q[1] - b) / b * 100;
  if (svg._tip) svg._tip.textContent = fmtFull(q[0], s.r) + " · " + fmt(q[1], s.c.cur) + " · " + pct(pc);
  if (ev.touches && ev.cancelable) ev.preventDefault();
}
function endScrub(ev){
  const svg = ev.currentTarget;
  svg.querySelectorAll(".cx,.cd").forEach((e) => e.setAttribute("visibility", "hidden"));
  setIdleTip(svg);
}

const ro = new ResizeObserver((entries) => entries.forEach((e) => drawChart(e.target)));
function setupChart(svg, tip, touch){
  svg._tip = tip;
  svg.addEventListener("mousemove", scrub);
  svg.addEventListener("mouseleave", endScrub);
  if (touch){ // solo nel dettaglio: nelle card il tocco deve poter scorrere la pagina
    svg.addEventListener("touchstart", scrub, { passive: false });
    svg.addEventListener("touchmove", scrub, { passive: false });
    svg.addEventListener("touchend", endScrub);
  }
  ro.observe(svg);
}

// ---------- riordino ----------
let dragging = null;
function persistOrder(){
  watch = [...$("list").querySelectorAll(".card")].map((c) => c._w);
  save("borsa.watch", watch);
}
function setupGrip(el, grip){
  const name = el._w.label || el._w.symbol;
  grip.setAttribute("aria-label", t("reorder") + " " + name);
  grip.onclick = (e) => e.stopPropagation();
  grip.onkeydown = (e) => {
    const dir = { ArrowUp: -1, ArrowLeft: -1, ArrowDown: 1, ArrowRight: 1 }[e.key];
    if (!dir) return;
    e.preventDefault();
    const sib = dir < 0 ? el.previousElementSibling : el.nextElementSibling;
    if (!sib) return;
    el.parentNode.insertBefore(el, dir < 0 ? sib : sib.nextSibling);
    grip.focus(); // spostare il nodo gli toglie il focus
    persistOrder();
    $("announce").textContent = `${name}: ${t("position")} ${watch.indexOf(el._w) + 1} ${t("of")} ${watch.length}`;
  };
  grip.onpointerdown = (e) => {
    e.preventDefault();
    grip.setPointerCapture(e.pointerId);
    dragging = el; el.classList.add("dragging");
  };
  grip.onpointermove = (e) => {
    if (dragging !== el) return;
    if (e.clientY < 80) scrollBy(0, -12); else if (e.clientY > innerHeight - 80) scrollBy(0, 12);
    const over = document.elementFromPoint(e.clientX, e.clientY)?.closest(".card");
    if (!over || over === el) return;
    const cards = [...el.parentNode.children];
    el.parentNode.insertBefore(el, cards.indexOf(el) < cards.indexOf(over) ? over.nextSibling : over);
  };
  grip.onpointerup = grip.onpointercancel = () => {
    if (dragging !== el) return;
    dragging = null; el.classList.remove("dragging");
    persistOrder();
  };
}

// ---------- zoom del grafico di dettaglio ----------
const MIN_SPAN = 8; // punti minimi visibili
// finestra visibile [a, b] (indici dei punti); null = tutto il periodo
function zoomView(view, n, factor, frac){
  const [a, b] = view || [0, n - 1], span = b - a;
  const ns = Math.round(Math.min(n - 1, Math.max(MIN_SPAN, span * factor)));
  if (ns >= n - 1) return null;
  const s = Math.round(Math.min(n - 1 - ns, Math.max(0, a + frac * (span - ns)))); // il punto sotto il cursore resta fermo
  return [s, s + ns];
}
function panView(view, n, shift){
  if (!view) return null;
  const ns = view[1] - view[0], s = Math.round(Math.min(n - 1 - ns, Math.max(0, view[0] + shift)));
  return [s, s + ns];
}
if (location.hostname === "localhost"){ // autoverifica in sviluppo
  console.assert(zoomView(null, 101, 0.5, 0.5) + "" === "25,75", "zoom al centro");
  console.assert(zoomView(null, 101, 0.5, 0) + "" === "0,50", "zoom a sinistra");
  console.assert(zoomView([25, 75], 101, 4, 0.5) === null, "zoom out oltre il periodo");
  console.assert(zoomView([40, 48], 101, 0.1, 0.5) + "" === "40,48", "limite MIN_SPAN");
  console.assert(panView([0, 50], 101, 80) + "" === "50,100", "pan limitato a destra");
}
const big = $("bigChart");
const pointsN = () => big._data ? big._data.d.points.length : 0;
const spanOf = (v) => v ? v[1] - v[0] : pointsN() - 1;
function fracAt(clientX){
  const st = big._st, r = big.getBoundingClientRect();
  return st ? Math.max(0, Math.min(1, (clientX - r.left - st.padL) / st.iw)) : 0.5;
}
function setView(svg, v){
  svg._view = v;
  drawChart(svg);
  svg.classList.toggle("zoomed", !!v);
  $("zoomIn").disabled = spanOf(v) <= MIN_SPAN;
  $("zoomOut").disabled = $("zoomReset").disabled = !v;
}
$("zoomIn").onclick = () => setView(big, zoomView(big._view, pointsN(), 0.5, 0.5));
$("zoomOut").onclick = () => setView(big, zoomView(big._view, pointsN(), 2, 0.5));
$("zoomReset").onclick = () => setView(big, null);
big.addEventListener("wheel", (e) => {
  if (!big._st) return;
  e.preventDefault();
  if (Math.abs(e.deltaX) > Math.abs(e.deltaY)) return setView(big, panView(big._view, pointsN(), e.deltaX / big._st.iw * spanOf(big._view)));
  // ctrlKey = pinch sul trackpad: delta piccoli, serve più sensibilità
  setView(big, zoomView(big._view, pointsN(), Math.exp(e.deltaY * (e.ctrlKey ? 0.01 : 0.002)), fracAt(e.clientX)));
}, { passive: false });
let panStart = null;
big.addEventListener("pointerdown", (e) => {
  if (e.pointerType !== "mouse" || !big._view) return;
  panStart = { x: e.clientX, v: big._view };
  big.setPointerCapture(e.pointerId);
});
big.addEventListener("pointermove", (e) => {
  if (panStart) setView(big, panView(panStart.v, pointsN(), -(e.clientX - panStart.x) / big._st.iw * spanOf(panStart.v)));
});
big.addEventListener("pointerup", () => panStart = null);
let pinch = null;
const touchGeo = (e) => { const [p, q] = e.touches; return { d: Math.hypot(p.clientX - q.clientX, p.clientY - q.clientY), m: (p.clientX + q.clientX) / 2 }; };
big.addEventListener("touchstart", (e) => {
  if (e.touches.length !== 2) return;
  const g = touchGeo(e);
  pinch = { ...g, v: big._view, f: fracAt(g.m) };
}, { passive: true });
big.addEventListener("touchmove", (e) => {
  if (!pinch || e.touches.length !== 2 || !big._st) return;
  e.preventDefault();
  const g = touchGeo(e), n = pointsN();
  const v = zoomView(pinch.v, n, pinch.d / g.d, pinch.f);
  setView(big, panView(v, n, -(g.m - pinch.m) / big._st.iw * spanOf(v)));
}, { passive: false });
big.addEventListener("touchend", (e) => { if (e.touches.length < 2) pinch = null; });

async function openDetail(symbol){
  detailSym = symbol;
  detailRange = range;
  const w = watch.find((x) => x.symbol === symbol);
  $("dName").textContent = (w && w.label) || symbol;
  $("dMeta").textContent = symbol;
  $("dPrice").textContent = "…"; $("dChg").textContent = ""; $("bigChart").innerHTML = ""; $("tip").textContent = ""; $("stats").innerHTML = "";
  $("bigChart")._data = null;
  openSheet("detail");
  setSeg("dRangeSeg", detailRange);
  await renderDetail();
}

async function renderDetail(){
  const sym = detailSym, r = detailRange;
  try {
    const d = await getChart(sym, r);
    if (sym !== detailSym || r !== detailRange) return;
    const c = await conv(d);
    const p = change(d, r);
    const base = baseOf(d, r);
    $("dMeta").textContent = [sym, d.name !== sym ? d.name : "", d.exchange, isIndex(d) ? t("points") : (normCur(d).cur + (c.cur && c.cur !== normCur(d).cur ? " → " + c.cur : ""))].filter(Boolean).join(" · ");
    $("dPrice").textContent = fmt(d.price * c.f, c.cur);
    const abs = base ? (d.price - base) * c.f : null;
    $("dChg").innerHTML = p == null ? "" :
      `<span style="color:${colorFor(p)}">${abs >= 0 ? "+" : ""}${fmt(abs, c.cur)} (${pct(p)})</span> <span class="dmeta">${t("chg" + r)}</span>`;
    const svg = $("bigChart");
    const fresh = !svg._data || svg._data.d !== d;
    svg._data = { d, c, p, r };
    fresh ? setView(svg, null) : drawChart(svg); // dati nuovi: zoom azzerato
    renderStats(d, c, r, base);
  } catch(e){
    $("dPrice").textContent = "n/d";
    $("dChg").innerHTML = '<span class="err"></span>';
    $("dChg").querySelector(".err").textContent = t("loadErr"); $("dChg").querySelector(".err").title = e.message;
  }
}

function renderStats(d, c, r, base){
  const vals = d.points.map((x) => x[1] * c.f);
  const hi = vals.length ? Math.max(...vals) : null, lo = vals.length ? Math.min(...vals) : null;
  const items = [
    [t(r === "1d" ? "prevClose" : "periodStart"), base != null ? fmt(base * c.f, c.cur) : "—"],
    [t("high"), fmt(hi, c.cur)],
    [t("low"), fmt(lo, c.cur)],
    [t("rangePct"), hi != null && lo ? pct((hi - lo) / lo * 100, false) : "—"],
    [t("lastPrice"), d.marketTime ? fmtFull(d.marketTime, "1d") : "—"],
  ];
  $("stats").innerHTML = items.map(() => '<div class="stat"><div class="k"></div><div class="v"></div></div>').join("");
  $("stats").querySelectorAll(".stat").forEach((el, i) => {
    el.querySelector(".k").textContent = items[i][0];
    el.querySelector(".v").textContent = items[i][1];
  });
}

// ---------- aggiunta ----------
let searchTimer = null;
$("addBtn").onclick = () => {
  $("q").value = ""; $("results").innerHTML = "";
  openSheet("adder", $("q"));
};
$("q").addEventListener("input", () => {
  clearTimeout(searchTimer);
  const v = $("q").value.trim();
  if (!v){ $("results").innerHTML = ""; return; }
  searchTimer = setTimeout(() => doSearch(v), 300);
});
$("q").addEventListener("keydown", (e) => {
  if (e.key === "Enter"){ const v = $("q").value.trim().toUpperCase(); if (v) addSymbol(v, v); }
});
async function doSearch(v){
  try {
    const res = await fetch("/api/search?q=" + encodeURIComponent(v));
    const d = await res.json();
    if ($("q").value.trim() !== v) return;
    const box = $("results");
    box.innerHTML = "";
    if (!d.results.length){ box.innerHTML = '<div class="hint"></div>'; box.firstChild.textContent = t("noResults"); return; }
    d.results.forEach((x) => {
      const el = document.createElement("button");
      el.type = "button"; el.className = "res";
      el.innerHTML = '<span><span class="a"></span><span class="dmeta"></span></span><span class="b"></span>';
      el.querySelector(".a").textContent = x.symbol;
      el.querySelector(".dmeta").textContent = x.name;
      el.querySelector(".b").textContent = [x.exchange, x.type].filter(Boolean).join(" · ");
      el.onclick = () => addSymbol(x.symbol, shortName(x.name));
      box.appendChild(el);
    });
  } catch(e){ $("results").innerHTML = '<div class="hint"></div>'; $("results").firstChild.textContent = t("searchErr"); }
}
function shortName(n){
  return n.replace(/,?\s+(Inc\.?|Corporation|Corp\.?|Ltd\.?|S\.p\.A\.?|SpA|N\.V\.|AG|SE|plc|Class [A-C])\b.*$/i, "").trim() || n;
}
function addSymbol(symbol, label){
  if (!watch.some((w) => w.symbol === symbol)){
    watch.push({ symbol, label });
    save("borsa.watch", watch);
  }
  closeSheet($("adder"));
  renderList();
}

$("removeBtn").onclick = () => {
  watch = watch.filter((w) => w.symbol !== detailSym);
  save("borsa.watch", watch);
  closeSheet($("detail"));
  renderList();
};

// ---------- controlli ----------
document.querySelectorAll("[data-close]").forEach((b) => b.onclick = () => closeSheet(b.closest(".sheet")));
document.querySelectorAll(".sheet").forEach((s) => s.addEventListener("click", (e) => { if (e.target === s) closeSheet(s); }));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") document.querySelectorAll(".sheet.open").forEach(closeSheet); });

$("rangeSeg").onclick = (e) => {
  const v = e.target.dataset.v; if (!v) return;
  range = v; save("borsa.range", v); setSeg("rangeSeg", v); renderList();
};
$("curSeg").onclick = (e) => {
  const v = e.target.dataset.v; if (!v) return;
  cur = v; save("borsa.cur", v); setSeg("curSeg", v); renderList();
  if ($("detail").classList.contains("open")) renderDetail();
};
$("dRangeSeg").onclick = (e) => {
  const v = e.target.dataset.v; if (!v) return;
  detailRange = v; setSeg("dRangeSeg", v); renderDetail();
};

setSeg("rangeSeg", range);
setSeg("curSeg", cur);
renderList();
setInterval(() => { if (!document.hidden) renderList(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) renderList(); });
</script>
</body>
